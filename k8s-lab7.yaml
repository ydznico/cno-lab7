apiVersion: apps/v1
kind: Deployment
metadata:
  name: cno-lab7-jenkins-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cno-lab7-jenkins
  template:
    metadata:
      labels:
        app: cno-lab7-jenkins
    spec:
      containers:
      - name: web
        image: ydznico/cno-lab7-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cno-lab7-svc
spec:
  type: NodePort
  selector:
    app: cno-lab7-jenkins
  ports:
  - port: 80
    targetPort: 80
